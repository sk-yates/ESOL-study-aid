<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESOL Study-Aid</title>    
    <script src="data.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1 class="site-title">ESOL Study-Aid</h1>
    </header>

    <div class="flex-container" id="level-list"></div>



    <script>

        const levelList = document.getElementById('level-list');

        function colorClass(level) {
            if (level.id === "pe") return "pre-entry";
            if (level.id === "e-1") return "entry-1";
            return " ";
        }

        // Build one tile's HTML for a single level object.
        function levelTileHtml(level) {
            const classes = ['flex-item', colorClass(level)];
            if (!level.published) classes.push('inactive');

            const heading = `<h2>${level.name}</h2>`;

            // Published levels get wrapped in a link; unpublished ones
            // stay as plain text inside the div, same as your originals.
            const inner = level.published
                ? `<a href="level.html?level=${level.id}">${heading}</a>`
                : heading;

            return `<div class="${classes.join(' ')}" id="${level.id}">${inner}</div>`;
        }

        // SITE_DATA.levels.map(...) runs levelTileHtml() once per level,
        // returning an array of HTML strings. .join('') glues them into
        // one string with nothing between entries (no separator needed —
        // each tile is already a full <div>...</div>).
        levelList.innerHTML = SITE_DATA.levels.map(levelTileHtml).join('');


    </script>
